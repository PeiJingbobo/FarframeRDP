name: Package Universal Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Build Universal DMG
    # The app uses SDK 26 SwiftUI APIs and Swift 6 diagnostics. Keep the
    # release runner aligned with the minimum toolchain that compiles it.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          . scripts/release-toolchain.sh
          developer_dir="/Applications/$FARFRAME_RELEASE_XCODE_APP_BASENAME/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Validate tag and app version
        env:
          FARFRAME_RELEASE_TAG: ${{ github.ref_name }}
        run: /bin/sh scripts/validate-release-version.sh "$FARFRAME_RELEASE_TAG"

      - name: Check required build tools
        run: |
          /bin/sh scripts/check-release-toolchain.sh
          cmake --version
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
          else
            make --version
          fi

      - name: Build and package Universal DMG
        env:
          FARFRAME_RELEASE_TAG: ${{ github.ref_name }}
          FARFRAME_DERIVED_DATA_PATH: ${{ github.workspace }}/.derivedData-action-release
        run: /bin/sh scripts/package-release.sh "$FARFRAME_RELEASE_TAG"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          dmg=".release/FarframeRDP-${version}-universal.dmg"
          checksum="${dmg}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg" "$checksum" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" "$dmg" "$checksum" \
              --draft=false \
              --generate-notes \
              --verify-tag \
              --title "Farframe RDP $version"
          fi
